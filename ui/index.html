<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trad</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* Elements specifiques au moteur API (ajout par-dessus styles.css). */
    .settings-btn { cursor: pointer; }
    /* « Historique » et « Réglages » groupes en fin de barre : quand la barre passe a la
       ligne (russe a 1000 px, fenetre etroite), ils s'y replient ENSEMBLE. */
    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-inline-start: auto;
    }
    .settings-panel {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 10px 16px;
      background: #f3f4f6;
      border-bottom: 1px solid #d1d5db;
    }
    .settings-panel[hidden] { display: none; }
    .settings-panel input[type="password"] {
      flex: 1 1 280px;
      min-width: 200px;
      padding: 7px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-family: monospace;
    }
    .key-status { font-size: 0.85rem; }
    .key-status[data-ok="1"] { color: #15803d; }
    .key-status[data-ok="0"] { color: #b91c1c; }
    .hint { font-size: 0.8rem; color: #6b7280; }
    .hint code { background: #e5e7eb; padding: 1px 5px; border-radius: 4px; }
    .hist-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      color: #374151;
      cursor: pointer;
      user-select: none;
    }
  </style>
</head>
<body>
  <!-- Textes : attributs data-i18n* remplis par main.js dans la langue de l'interface
       (dictionnaires dans i18n.js). Le texte ecrit ici n'est que le repli anglais. -->
  <header class="toolbar">
    <h1 class="app-title">Trad</h1>
    <label class="lang-field">
      <span data-i18n="toolbar.model">Model</span>
      <!-- Haiku 5.5 en PREMIER = modele par defaut d'un nouvel utilisateur (le moins cher). -->
      <select id="model">
        <option value="claude-haiku-5-5" data-i18n="model.haiku">Haiku 5.5 — fast, low cost</option>
        <option value="claude-opus-5-5" data-i18n="model.opus">Opus 5.5 — highest quality</option>
        <option value="claude-sonnet-5-5" data-i18n="model.sonnet">Sonnet 5.5 — balanced</option>
      </select>
    </label>
    <label class="lang-field">
      <span data-i18n="toolbar.target">Translate into</span>
      <!-- Options generees par main.js : noms des langues dans la langue de l'interface. -->
      <select id="lang"></select>
    </label>
    <button id="translate-btn" type="button" data-i18n="toolbar.translate">Translate</button>
    <div class="toolbar-actions">
      <button id="history-btn" type="button" class="settings-btn" data-i18n="toolbar.history"
              data-i18n-title="toolbar.historyTitle" aria-controls="history-panel" aria-expanded="true">History</button>
      <button id="settings-btn" type="button" class="settings-btn" data-i18n="toolbar.settings"
              data-i18n-title="toolbar.settingsTitle" aria-controls="settings-panel" aria-expanded="false">Settings</button>
    </div>
  </header>

  <!-- Barre d'etat : statistiques de la derniere traduction (ou de l'entree rechargee de
       l'historique) a gauche, message d'etat a droite. Toute la largeur de la fenetre :
       la barre d'outils, elle, n'a pas la place d'un message dans toutes les langues.
       Le total de l'historique est en pied de la colonne d'historique. -->
  <section id="stats-bar" class="stats-bar">
    <div id="stats-main" class="stats-main"></div>
    <span id="status" class="status" role="status" aria-live="polite"></span>
  </section>

  <section id="settings-panel" class="settings-panel" hidden>
    <label class="lang-field key-field" style="flex:1 1 280px;">
      <span data-i18n="settings.apiKey">Anthropic API key</span>
      <input id="api-key" type="password" placeholder="sk-ant-..." autocomplete="off" spellcheck="false" />
    </label>
    <button id="save-key-btn" type="button" data-i18n="settings.save">Save</button>
    <button id="clear-key-btn" type="button" data-i18n="settings.clear">Remove</button>
    <span id="key-status" class="key-status" role="status"></span>
    <span class="hint"><span data-i18n="settings.getKey">Get a key:</span> <code>console.anthropic.com/settings/keys</code></span>
    <label class="lang-field">
      <span data-i18n="settings.uiLang">Interface language</span>
      <select id="ui-lang"></select>
    </label>
    <label class="hist-toggle" data-i18n-title="settings.saveHistoryTitle">
      <input id="history-enabled" type="checkbox" checked />
      <span data-i18n="settings.saveHistory">Save history</span>
    </label>
  </section>

  <main class="workspace">
    <aside id="history-panel" class="history-panel">
      <div class="history-head">
        <span class="history-title" data-i18n="history.title">History</span>
        <button id="history-clear-btn" type="button" class="mini-btn" data-i18n="history.clear"
                data-i18n-title="history.clearTitle">Clear</button>
      </div>
      <input id="history-search" type="search" class="history-search" data-i18n-placeholder="history.search"
             data-i18n-aria-label="history.search" placeholder="Search…" autocomplete="off" spellcheck="false" />
      <ul id="history-list" class="history-list"></ul>
      <p id="history-empty" class="history-empty"></p>
      <!-- Cout total des traductions de l'historique qui ont des statistiques. -->
      <div id="history-total" class="history-total" hidden></div>
    </aside>
    <!-- Poignee de redimensionnement de l'historique : glisser, fleches du clavier,
         double-clic = largeur par defaut. -->
    <div id="history-resizer" class="history-resizer" role="separator" aria-orientation="vertical"
         aria-controls="history-panel" tabindex="0" data-i18n-title="history.resize"
         data-i18n-aria-label="history.resize"></div>

    <div class="panes">
      <section class="pane pane-source">
        <div class="pane-head"><span id="source-titre" data-i18n="pane.source">Source text</span></div>
        <textarea id="source" dir="auto" aria-labelledby="source-titre" data-i18n-placeholder="pane.sourcePlaceholder"
                  placeholder="Paste or type the text to translate… (Ctrl+Enter)"></textarea>
      </section>
      <section class="pane pane-target">
        <div class="pane-head">
          <span id="target-titre" data-i18n="pane.target">Translation</span>
          <button id="copy-btn" type="button" class="copy-btn" data-i18n="pane.copy">Copy</button>
        </div>
        <textarea id="target" dir="auto" readonly aria-labelledby="target-titre" data-i18n-placeholder="pane.targetPlaceholder"
                  placeholder="The translation will appear here…"></textarea>
      </section>
    </div>
  </main>

  <script src="i18n.js"></script>
  <script src="main.js"></script>
</body>
</html>
